# Production compose for the VPS (~/projects/ladonuts/).
# Since 2026-07-09 the image is built by GitHub Actions and pulled from
# GHCR — no more building on the VPS. See .github/workflows/deploy.yml.
# Migrations run as a one-off container from the deploy workflow, so
# there is no migrator service here anymore.

services:
  ladonuts:
    image: ghcr.io/bufordeeds/la-donuts:latest
    container_name: ladonuts
    restart: unless-stopped
    env_file: .env.production
    networks:
      - web
      - internal

networks:
  web:
    external: true
  internal:
    external: true
